name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync Morphe Desktop
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MorpheApp/morphe-desktop.git
          git fetch upstream --tags

          # Merge upstream without committing so fork-specific workflow files
          # can be preserved in the merge result.
          git merge upstream/main --no-edit --no-commit

          # Keep this fork's workflow files exactly as they were before the merge.
          git restore --source=HEAD --staged --worktree .github/workflows

          # Remove workflow files that exist only on upstream.
          git diff --name-only --diff-filter=A HEAD -- .github/workflows | while IFS= read -r file; do
            git rm -f -- "$file"
          done

          # If upstream is already fully synchronized (or the merge produced no
          # remaining changes after preserving workflows), there is nothing to commit.
          if git diff --cached --quiet && git diff --quiet; then
            echo "Already up to date. Nothing to commit."
            exit 0
          fi

          git commit -m "Merge upstream/main"

          git push origin main