name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync Morphe Desktop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MorpheApp/morphe-desktop.git
          git fetch upstream --tags

          git merge upstream/main --no-edit

          # Keep fork-owned GitHub Actions workflows local.
          # The default GITHUB_TOKEN cannot push changes to workflow files.
          git checkout HEAD -- .github/workflows
          git add .github/workflows
          git commit --amend --no-edit

          git push origin main
          git push origin --tags
